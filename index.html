<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- {{ ... }} placeholders are filled from src/content/site.json at build time -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ meta.title }}</title>

    <!-- theme + analytics bootstrap (kept external so the CSP needs no 'unsafe-inline') -->
    <script src="/head.js" data-ga-id="{{ meta.googleAnalyticsId }}"></script>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id={{ meta.googleAnalyticsId }}"
    ></script>

    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&display=swap"
    />

    <meta name="google-site-verification" content="{{ meta.googleSiteVerification }}" />
    <meta name="description" content="{{ meta.description }}" />
    <meta name="author" content="{{ meta.author }}" />
    <meta name="keywords" content="{{ meta.keywords }}" />
    <meta name="theme-color" content="{{ meta.themeColor }}" />
    <link rel="canonical" href="{{ meta.url }}" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ meta.author }}" />
    <meta property="og:title" content="{{ meta.shareTitle }}" />
    <meta property="og:description" content="{{ meta.shareDescription }}" />
    <meta property="og:url" content="{{ meta.url }}" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
